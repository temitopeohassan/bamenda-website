<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Bamenda | Formworks, Real Estate & Travel in Nigeria</title>
    <meta
      name="description"
      content="Bamenda: formwork construction and engineering, property sourcing for rent, lease or purchase in Lagos and Abuja, and tailored educational and leisure travel."
    />
    <script>
      // Home hero entrance: compose the opening frame before first paint.
      // Hero.jsx plays the sequence and then removes the class.
      (function () {
        try {
          if (location.pathname === '/' &&
              (!window.matchMedia || !matchMedia('(prefers-reduced-motion: reduce)').matches)) {
            document.documentElement.classList.add('anim');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&family=Prata&family=Hanken+Grotesk:wght@400;500;600;700&family=Poppins:wght@500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
